<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Google Search Console-->

    <title>学習コンテンツ一覧 (電気化学)</title>

    <meta name="description" content="高専生のための教材置き場。学習に役立つコンテンツを順次追加していきます。">

    <link rel="stylesheet" href="style.css" />
    <!-- 標準的なファビコン（16x16 / 32x32など） -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.ico">

    <!-- Apple Touch Icon (iPhoneなど) -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>

<body>

    <!-- =========================
         Header
    ========================== -->
    <header class="header">
        <div class="header-inner">
            <a href="https://study.kikuchan-code.workers.dev/" class="logo">
                <p class="logo-subtitle">高専生の基礎学習をサポート</p>
                <span class="logo-title">Base Study Hub <em class="logo-em">KOSEN</em></span>
            </a>

            <!-- Hamburger -->
            <button class="hamburger" id="hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Navigation -->
            <nav class="nav" id="nav">
                <ul class="nav-list">
                    <li><a href="#works">電気化学</a></li>
                    <li><a href="https://study.kikuchan-code.workers.dev/">ホームにもどる</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- =========================
         Main
    ========================== -->
    <main class="main-content">

        <!-- Works -->
        <section class="section" id="works">
            <div class="container">

                <nav class="breadcrumb">
                    <a href="https://study.kikuchan-code.workers.dev/">ホーム</a> &gt; <span>電気化学</span>
                </nav>

                <h2 class="section-title">学習コンテンツ一覧 (電気化学)</h2>



                <!-- PDF資料一覧 -->
                <div class="pdf-section">
                    <h3 class="category-title">シート一覧</h3>
                    <p class="pdf-description">
                        学習資料をブラウザで閲覧したり、端末に保存したりできます。
                    </p>

                    <div class="pdf-list">

                        <!-- PDF資料 1 -->
                        <article class="pdf-card">
                            <div class="pdf-card-header">
                                <span class="pdf-badge">PDF</span>
                                <div class="pdf-card-info">
                                    <h4>電気化学まとめシート（基礎編）</h4>
                                    <p>電気化学の学習に使用する配布資料です。</p>
                                </div>
                            </div>

                            <div class="pdf-actions">
                                <a href="./PDF/electrochemistry.pdf" class="pdf-btn pdf-view" target="_blank"
                                    rel="noopener">
                                    <span aria-hidden="true">↗</span>
                                    ブラウザで閲覧
                                </a>

                                <a href="./PDF/electrochemistry.pdf" class="pdf-btn pdf-download"
                                    download="電気化学まとめシート（基礎編）.pdf">
                                    <span aria-hidden="true">↓</span>
                                    ダウンロード
                                </a>
                            </div>

                            <details class="pdf-preview">
                                <summary>ページ内でプレビュー</summary>
                                <div class="pdf-viewer">
                                    <iframe src="./PDF/electrochemistry.pdf" title="有機化学の学習資料" loading="lazy"></iframe>
                                </div>
                            </details>
                        </article>

                        <!-- PDF資料を増やす場合は、ここにpdf-cardを追加 -->

                    </div>
                </div>


            </div>

            </div>
        </section>

    </main>

    <!-- =========================
         To Top Button
    ========================== -->
    <button id="toTopBtn" class="to-top-btn" title="上へ戻る">
        <span aria-hidden="true" class="to-top-icon"></span>
    </button>

    <!-- =========================
         Scripts
    ========================== -->
    <script src="script.js"></script>

</body>

</html>
